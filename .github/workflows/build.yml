name: Build Niebla Mistica

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Localizar el proyecto (suelto o dentro de un zip) y compilar
        run: |
          mkdir -p "$GITHUB_WORKSPACE/salida"
          echo "=== RAIZ DEL REPOSITORIO ==="
          ls -la

          if [ -f build.gradle ] && [ -d src/main/java ]; then
            echo "Proyecto suelto en la raiz del repositorio"
            DIR="$GITHUB_WORKSPACE"
          else
            ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1 || true)
            if [ -n "$ZIP" ]; then
              echo "Encontrado zip: $ZIP"
              rm -rf /tmp/proyecto && mkdir -p /tmp/proyecto
              unzip -q "$ZIP" -d /tmp/proyecto
              SETTINGS=$(find /tmp/proyecto -name settings.gradle -not -path '*/build/*' | head -n 1)
            else
              SETTINGS=$(find "$GITHUB_WORKSPACE" -name settings.gradle -not -path '*/.git/*' | head -n 1 || true)
            fi
            if [ -z "${SETTINGS:-}" ]; then
              echo "ERROR: no encuentro settings.gradle (ni suelto ni dentro de un zip)"
              exit 1
            fi
            DIR=$(dirname "$SETTINGS")
          fi

          echo "Proyecto en: $DIR"
          test -d "$DIR/src/main/java" || { echo "ERROR: falta src/main/java en $DIR"; exit 1; }
          echo "Archivos .java: $(find "$DIR/src/main/java" -name '*.java' | wc -l)"

          (cd "$DIR" && gradle build --no-daemon --stacktrace)

          JAR=$(ls "$DIR"/build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "Revisando $JAR"
          unzip -l "$JAR" | grep -q 'META-INF/mods.toml' || { echo "ERROR: el jar no contiene mods.toml"; exit 1; }
          unzip -l "$JAR" | grep -q 'com/nieblamistica/NieblaMistica.class' || { echo "ERROR: el jar no contiene clases compiladas"; exit 1; }
          cp "$DIR"/build/libs/*.jar "$GITHUB_WORKSPACE/salida/"
          ls -la "$GITHUB_WORKSPACE/salida"

      - name: Subir el .jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: niebla-mistica
          path: salida/*.jar

      - name: Publicar release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: salida/*.jar
